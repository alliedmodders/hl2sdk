}

message CUsrMsg_Terror_SteamWeaponStatData {
	message weapon_t {
		optional int32 weaponID = 1;
		optional int32 shotfired = 2;
		optional int32 hit = 3;
		optional int32 headshot = 4;
		optional int32 kills = 5;
		optional int32 damage = 6;
	}

	repeated .CUsrMsg_Terror_SteamWeaponStatData.weapon_t weapons = 1;
}

message CUsrMsg_Terror_CurrentTimescale {
}

message CUsrMsg_Terror_DesiredTimescale {
}

message CUsrMsg_Terror_PZEndGamePanelMsg {
