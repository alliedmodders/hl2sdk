}

message CUsrMsg_Terror_PZEndGameVoteStatsMsg {
	message PZVoteData {
		optional int32 numPlayers = 1;
		optional int32 votesYes = 2;
		optional int32 votesNo = 3;
		optional int32 votesFinished = 4;
	}

	repeated .CUsrMsg_Terror_PZEndGameVoteStatsMsg.PZVoteData pz_vote_data = 1;
}

message CUsrMsg_Terror_VoteStart {
	optional int32 team = 1;
	optional .CMsgEntity entity = 2;
	optional string issue = 3;
	optional string param1 = 4;
	optional string votecaller = 5;
}

message CUsrMsg_Terror_VotePass {
	optional int32 team = 1;
	optional string result = 2;
	optional string param1 = 3;
}

message CUsrMsg_Terror_VoteFail {
