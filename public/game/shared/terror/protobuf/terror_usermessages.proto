enum EMusicCmdType {
	MUSIC_PLAY = 0;
	MUSIC_PLAYPOS = 1;
	MUSIC_STOP = 2;
	MUSIC_STOPTRACK = 3;
	MUSIC_CMD = 4;
}

message CUsrMsg_Terror_Splatter {
	optional int32 count = 1;
}

message CUsrMsg_Terror_MeleeSlashSplatter {
	optional int32 count = 1;
}

message CUsrMsg_Terror_MeleeClubSplatter {
	optional int32 count = 1;
}

message CUsrMsg_Terror_MudSplatter {
	optional int32 count = 1;
}

message CUsrMsg_Terror_SplatterClear {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_MessageText {
}

message CUsrMsg_Terror_TransitionRestore {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_Spawn {
	optional int32 team = 1;
}

message CUsrMsg_Terror_CreditsLine {
	optional string line = 1;
}

message CUsrMsg_Terror_CreditsMsg {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_JoinLateMsg {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_StatsCrawlMsg {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_StatsSkipState {
	optional int32 skips = 1;
	optional int32 players = 2;
}

message CUsrMsg_Terror_ShowStats {
}

message CUsrMsg_Terror_BlurFade {
}

message CUsrMsg_Terror_MusicCmd {
	message sound_t {
		oneof sound {
			int32 hash = 1;
			string name = 2;
		}
	}

	message play_t {
		optional .CUsrMsg_Terror_MusicCmd.sound_t sound = 1;
		optional float fadeTime = 2;
		optional .CMsgEntity emit = 3;
		optional .CMsgVector pos = 4;
	}

	message stop_t {
		optional .CUsrMsg_Terror_MusicCmd.sound_t sound = 1;
		optional float fadeTime = 2;
		optional bool track = 3;
	}

	message cmd_t {
		optional string cmd = 1;
		optional string arg1 = 2;
		optional string arg2 = 3;
		optional .CMsgEntity arg3 = 4;
	}

	optional .CMsgEntity player = 1;

	oneof cmds {
		.CUsrMsg_Terror_MusicCmd.play_t play = 2;
		.CUsrMsg_Terror_MusicCmd.stop_t stop = 3;
		.CUsrMsg_Terror_MusicCmd.cmd_t cmd = 4;
	}
}

message CUsrMsg_Terror_WitchBloodSplatter {
	optional .CMsgVector pos = 1;
}

message CUsrMsg_Terror_AchievementEvent {
}

message CUsrMsg_Terror_PZDmgMsg {
	optional int32 type = 1;
	optional int32 attacker = 2;
	optional int32 target = 3;
	optional int32 assistingPlayer = 4;
	optional int32 extraNum = 5;
}

message CUsrMsg_Terror_AllPlayersConnectedGameStarting {
	optional int32 dummy = 1;
}

message CUsrMsg_Terror_VoteRegistered {
